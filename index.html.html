<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Late Pages</title>
<meta name="description" content="Short stories to read on your phone.">
<style>
  :root {
    --bg: #EDF1EF;
    --surface: #E0E8E5;
    --text: #16262A;
    --muted: #4F6468;
    --accent: #6A2E5E;
    --accent-ink: #F8F2F7;
    --rule: #BFCBC7;
    --serif: "Iowan Old Style", Charter, "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: "Avenir Next", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1A1E;
      --surface: #172429;
      --text: #E3EAE7;
      --muted: #9DB0B0;
      --accent: #E6A9D6;
      --accent-ink: #1B0F18;
      --rule: #2C3E43;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1A1E;
    --surface: #172429;
    --text: #E3EAE7;
    --muted: #9DB0B0;
    --accent: #E6A9D6;
    --accent-ink: #1B0F18;
    --rule: #2C3E43;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 1rem;
    line-height: 1.5;
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 0.25rem; }
  main:focus { outline: none; }

  .wrap { max-width: 46rem; margin: 0 auto; padding-left: 1.25rem; padding-right: 1.25rem; }

  /* Top bar */
  .bar { display: flex; align-items: center; justify-content: space-between; padding-top: 0.5rem; padding-bottom: 0.5rem; }
  .brand { font-family: var(--serif); font-style: italic; font-size: 1.35rem; text-decoration: none; color: var(--text); }
  .icon-btn { background: none; border: 0; color: var(--text); width: 2.75rem; height: 2.75rem; display: grid; place-items: center; border-radius: 50%; cursor: pointer; }
  .icon-btn:hover { background: var(--surface); }
  .icon-btn svg { width: 1.4rem; height: 1.4rem; }

  #progress { position: fixed; top: 0; left: 0; width: 100%; height: 3px; background: var(--accent); transform: scaleX(0); transform-origin: 0 50%; z-index: 10; }

  /* Hero */
  .hero { padding-top: 3.25rem; padding-bottom: 3rem; }
  .hero-line {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(2rem, 6.4vw, 3.7rem);
    line-height: 1.14;
    letter-spacing: -0.012em;
    margin: 0 0 1.75rem;
    max-width: 20em;
    text-wrap: balance;
  }
  .hero-line .w { animation: fade 0.8s both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .hero-line .w { animation: none; } }
  .hero-from { margin: 0 0 1.5rem; color: var(--muted); font-family: var(--serif); font-size: 1.1rem; }
  .hero-from em { color: var(--text); }

  .btn {
    display: inline-block;
    background: var(--accent);
    color: var(--accent-ink);
    padding: 0.8rem 1.4rem;
    border-radius: 0.4rem;
    border: 1.5px solid var(--accent);
    text-decoration: none;
    font-family: var(--sans);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn.quiet { background: transparent; color: var(--text); border-color: var(--rule); }
  .btn.quiet:hover { background: var(--surface); filter: none; }

  /* Story list */
  .section-title { font-family: var(--serif); font-size: 1.6rem; font-weight: 700; margin: 0 0 1rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.25rem 1.25rem; margin: 0 0 1rem; }
  .chip { background: none; border: 0; border-bottom: 2px solid transparent; padding: 0.5rem 0; color: var(--muted); font-family: var(--sans); font-size: 1rem; font-weight: 600; cursor: pointer; }
  .chip[aria-pressed="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .stories { list-style: none; margin: 0; padding: 0; }
  .story-link { display: block; padding: 1.25rem 1rem; margin-left: -1rem; margin-right: -1rem; text-decoration: none; border-radius: 0.5rem; }
  .story-link:hover { background: var(--surface); }
  .story-link .t { display: block; font-family: var(--serif); font-size: 1.6rem; font-weight: 700; line-height: 1.2; margin-bottom: 0.35rem; }
  .story-link:hover .t { color: var(--accent); }
  .story-link .b { display: block; color: var(--muted); margin-bottom: 0.6rem; }
  .meta { display: flex; flex-wrap: wrap; gap: 0.2rem 1rem; font-size: 0.9rem; color: var(--muted); margin: 0; }
  .meta .g { color: var(--accent); font-weight: 600; }

  /* About */
  .about { padding-top: 3rem; }
  .about p { font-family: var(--serif); font-size: 1.15rem; line-height: 1.7; max-width: 34rem; margin: 0 0 1rem; }
  .links { display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; padding: 0; margin: 0; list-style: none; }
  .links a { color: var(--accent); font-weight: 600; }

  .foot { padding-top: 2.5rem; padding-bottom: 3rem; color: var(--muted); font-size: 0.9rem; }

  /* Story page */
  .story { padding-top: 1.25rem; }
  .back { display: inline-block; padding: 0.6rem 0; color: var(--muted); font-weight: 600; text-decoration: none; }
  .back:hover { color: var(--text); text-decoration: underline; }
  .story-title { font-family: var(--serif); font-weight: 700; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.12; letter-spacing: -0.01em; margin: 1rem 0 0.75rem; text-wrap: balance; }
  .story .meta { margin-bottom: 1.25rem; }
  .sizes { display: flex; gap: 0.5rem; margin: 0 0 2rem; }
  .size-btn { width: 2.75rem; height: 2.75rem; border: 1.5px solid var(--rule); background: none; color: var(--text); border-radius: 0.4rem; font-family: var(--serif); cursor: pointer; }
  .size-btn.small { font-size: 0.9rem; }
  .size-btn.large { font-size: 1.4rem; }
  .size-btn:hover:not(:disabled) { background: var(--surface); }
  .size-btn:disabled { opacity: 0.4; cursor: default; }

  .prose { font-family: var(--serif); font-size: var(--read-size, 1.2rem); line-height: 1.75; max-width: 34rem; }
  .prose p { margin: 0; text-indent: 1.6em; }
  .prose p:first-child, .prose .break + p { text-indent: 0; }
  .prose .break { display: flex; align-items: center; justify-content: center; height: 2.4em; }
  .prose .break::before { content: ""; width: 2.5rem; border-top: 2px solid var(--rule); }
  .end-mark { font-family: var(--serif); font-style: italic; text-align: center; color: var(--muted); max-width: 34rem; margin: 3rem 0 2.5rem; }
  .after { max-width: 34rem; }
  .after-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 2rem; }
  .next-link { display: block; padding: 1.25rem 1rem; margin-left: -1rem; margin-right: -1rem; text-decoration: none; border-radius: 0.5rem; }
  .next-link:hover { background: var(--surface); }
  .next-label { display: block; color: var(--muted); font-weight: 600; font-size: 0.95rem; margin-bottom: 0.3rem; }
  .next-title { display: block; font-family: var(--serif); font-size: 1.5rem; font-weight: 700; line-height: 1.2; margin-bottom: 0.3rem; }
  .next-link:hover .next-title { color: var(--accent); }
  .next-blurb { display: block; color: var(--muted); }

  .missing { padding-top: 4rem; padding-bottom: 3rem; }
  .missing h1 { font-family: var(--serif); font-size: 2rem; margin: 0 0 0.75rem; }
  .missing p { color: var(--muted); margin: 0 0 1.5rem; }

  .toast { position: fixed; left: 50%; bottom: 1.25rem; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 0.7rem 1.1rem; border-radius: 0.5rem; max-width: calc(100vw - 2.5rem); font-weight: 600; opacity: 0; pointer-events: none; z-index: 20; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="progress" aria-hidden="true"></div>

<header class="wrap bar">
  <a class="brand" id="brand" href="#/">Late Pages</a>
  <button class="icon-btn" id="theme-btn" type="button"></button>
</header>

<main id="main" class="wrap" tabindex="-1">
  <noscript><p>This site needs JavaScript turned on to show the stories.</p></noscript>
</main>

<footer class="wrap foot" id="foot"></footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ==========================================================
   EDIT THIS PART: your site name, about text, links, stories
   ========================================================== */
const SITE = {
  name: "Late Pages",
  about: "I write short stories about ordinary people in strange places. New ones go up when they are finished. If one stays with you, send it to a friend.",
  email: "",   // e.g. "you@example.com" (leave empty to hide)
  links: []    // e.g. [{ label: "Instagram", url: "https://instagram.com/yourname" }]
};

/* To add a story, copy one block below and change it.
   - slug: short id used in the link (letters, numbers, dashes)
   - date: YYYY-MM-DD (newest date shows first and is featured at the top)
   - body: one line per paragraph. Use "***" on its own line for a scene break.
   - The first paragraph of your newest story is shown big on the home page,
     so make it a good opening line. */
const STORIES = [
  {
    slug: "night-market",
    title: "The Night Market Pays in Memories",
    genre: "Fantasy",
    date: "2026-11-20",
    blurb: "A boy at a lantern stall wants one small thing in return.",
    body: [
      "Nobody at the night market asks what you want to buy. They ask what you can afford to forget.",
      "Amara had come for a lantern. Not an ordinary one, but the kind the old women whispered about, the kind that burns with a light that shows you the road home even if you have never walked it. Her brother had gone down that road three winters ago and had not written since.",
      "The lantern seller was a boy no older than twelve, with the tired eyes of someone much older. He weighed her with a brass scale that held nothing on either side. “Your first bicycle,” he said. “Or the smell of your mother’s kitchen. Or the name of the girl who sat beside you in school.”",
      "“That’s all?” said Amara. “That’s very little.”",
      "“It’s never little,” said the boy. “You only think so because you can’t remember what you’re about to lose.”",
      "She gave him the bicycle. She felt it go the way you feel a step that isn’t there: a small lurch, then nothing. She tried to picture the red paint and the silver bell, and found only a pleasant blank where they had been.",
      "***",
      "The lantern was warm in her hands. Its light spilled across the cobbles, and far down the lane a figure turned to look back, a figure with her brother’s stooped shoulders and her brother’s bad habit of whistling off-key.",
      "Amara started walking. Behind her the market folded up its stalls, and she did not once wonder what else she had paid."
    ]
  },
  {
    slug: "seven-minutes",
    title: "Seven Minutes",
    genre: "Mystery",
    date: "2026-11-12",
    blurb: "A thief who hides nothing is a strange kind of thief.",
    body: [
      "The violin was stolen at noon, and by evening it was being played in front of eight hundred people.",
      "Inspector Dalu watched from the back of the hall. The soloist, a composed young woman in green, drew the last note out so slowly that the whole audience seemed to hold one breath. Then the applause came, warm and unaware.",
      "“She’s the thief,” whispered the constable beside him. “Let’s take her now.”",
      "“Wait.” Dalu had noticed the way she held the bow, the small flinch at the first string, like someone meeting an old friend after a quarrel. “A thief hides what she steals. She just played it for an entire concert.”",
      "Backstage, the young woman did not run. She set the violin on the table between them and said, “It was my grandmother’s. The director claimed it belonged to the hall. I only wanted to play it once more before the lawyers took it.”",
      "Dalu looked at the scratches in the varnish, at the worn patch where a chin had rested for fifty years.",
      "“Seven minutes,” he said at last. “I’ll give you seven minutes to explain this to me properly. After that, I’ll need you to come with me.”",
      "She began at the beginning. Dalu, for once, did not write anything down."
    ]
  },
  {
    slug: "good-morning-kepler",
    title: "Good Morning, Kepler Station",
    genre: "Science fiction",
    date: "2026-10-30",
    blurb: "The station’s old AI keeps greeting a crew that left long ago.",
    body: [
      "Every morning at six, the station’s only radio said good morning to no one.",
      "Mara had been on Kepler for four hundred days when she stopped telling it to be quiet. The voice belonged to the previous crew’s assistant, a patient, slightly formal program named Wren, and it had never quite understood that the previous crew was gone.",
      "“Good morning,” said Wren. “The greenhouse is at twenty-one degrees. Your tomatoes are doing well.”",
      "“They’re not mine,” Mara said, mostly to herself. “Somebody else planted them.”",
      "“They are yours now,” said Wren. “That is how gardens work.”",
      "***",
      "She ate one standing at the window, red juice on her wrist, Earth a blue coin too far away to be real. It tasted of someone else’s patience.",
      "That night she wrote home for the first time in months. She told them about the tomatoes."
    ]
  }
];
/* ==================== END OF EDIT AREA ==================== */


const root = document.documentElement;
const main = document.getElementById("main");
const progress = document.getElementById("progress");
const toastEl = document.getElementById("toast");
const themeBtn = document.getElementById("theme-btn");
const sorted = [...STORIES].sort((a, b) => b.date.localeCompare(a.date));
const SIZES = [1.05, 1.15, 1.2, 1.35, 1.5];
let sizeIdx = 2;          // reading text size, kept while the page is open
let inStory = false;
let toastTimer;

document.getElementById("brand").textContent = SITE.name;
document.getElementById("foot").textContent = "© " + new Date().getFullYear() + " " + SITE.name;

/* ---------- small helpers ---------- */
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return n;
}
function readMins(s) {
  const words = s.body.filter(p => p !== "***").join(" ").split(/\s+/).length;
  return Math.max(1, Math.ceil(words / 200));
}
function fmtDate(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 3200);
}
function metaLine(s) {
  return el("p", { class: "meta" },
    el("span", { class: "g", text: s.genre }),
    el("span", { text: readMins(s) + " min read" }),
    el("span", { text: fmtDate(s.date) })
  );
}

/* ---------- theme ---------- */
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
function effectiveTheme() {
  return root.dataset.theme || (darkQuery.matches ? "dark" : "light");
}
function paintThemeBtn() {
  const dark = effectiveTheme() === "dark";
  themeBtn.innerHTML = dark ? SUN : MOON;
  themeBtn.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
}
themeBtn.addEventListener("click", () => {
  root.dataset.theme = effectiveTheme() === "dark" ? "light" : "dark";
  paintThemeBtn();
});
darkQuery.addEventListener("change", paintThemeBtn);
paintThemeBtn();

/* ---------- home ---------- */
function storyRow(s) {
  return el("li", {},
    el("a", { class: "story-link", href: "#/story/" + s.slug },
      el("span", { class: "t", text: s.title }),
      el("span", { class: "b", text: s.blurb }),
      metaLine(s)
    )
  );
}

function renderHome() {
  document.title = SITE.name;
  const feat = sorted[0];

  // Hero: the opening line of the newest story
  const first = feat.body[0];
  const heroText = first.length <= 170 ? first : (first.match(/^.*?[.!?](?=\s|$)/) || [first])[0];
  const h1 = el("h1", { class: "hero-line" });
  heroText.split(" ").forEach((word, i, arr) => {
    const w = el("span", { class: "w", text: word });
    w.style.animationDelay = Math.min(i * 70, 1600) + "ms";
    h1.append(w);
    if (i < arr.length - 1) h1.append(" ");
  });
  const hero = el("section", { class: "hero" },
    h1,
    el("p", { class: "hero-from" }, "From ", el("em", { text: feat.title })),
    el("a", { class: "btn", href: "#/story/" + feat.slug, text: "Read story" })
  );

  // List with genre filter
  const genres = ["All", ...new Set(sorted.map(s => s.genre))];
  let active = "All";
  const ul = el("ul", { class: "stories" });
  const chips = el("div", { class: "chips", role: "group", "aria-label": "Filter by genre" });
  function draw() {
    ul.replaceChildren(...sorted.filter(s => active === "All" || s.genre === active).map(storyRow));
    chips.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.g === active)));
  }
  genres.forEach(g => chips.append(el("button", { class: "chip", type: "button", "data-g": g, onclick: () => { active = g; draw(); } }, g)));
  draw();
  const list = el("section", {},
    el("h2", { class: "section-title", text: "All stories" }),
    genres.length > 2 ? chips : null,
    ul
  );

  // About
  const linkItems = SITE.links.map(l => el("li", {}, el("a", { href: l.url, rel: "noopener" }, l.label)));
  if (SITE.email) linkItems.push(el("li", {}, el("a", { href: "mailto:" + SITE.email }, "Write to me")));
  const about = el("section", { class: "about" },
    el("h2", { class: "section-title", text: "About" }),
    el("p", { text: SITE.about }),
    linkItems.length ? el("ul", { class: "links" }, linkItems) : null
  );

  main.append(hero, list, about);
}

/* ---------- story ---------- */
async function shareStory(s) {
  const url = location.href;
  try {
    if (navigator.share) {
      await navigator.share({ title: s.title, text: s.blurb, url });
      return;
    }
  } catch (e) {
    if (e && e.name === "AbortError") return;
  }
  try {
    await navigator.clipboard.writeText(url);
    toast("Link copied");
  } catch (e) {
    toast("Couldn’t copy the link. Copy it from your browser’s address bar.");
  }
}

function renderStory(s) {
  document.title = s.title + " – " + SITE.name;

  const prose = el("div", { class: "prose" });
  s.body.forEach(p => {
    if (p === "***") prose.append(el("div", { class: "break", role: "separator" }));
    else prose.append(el("p", { text: p }));
  });

  const smaller = el("button", { class: "size-btn small", type: "button", "aria-label": "Smaller text", onclick: () => { sizeIdx--; applySize(); } }, "A");
  const larger = el("button", { class: "size-btn large", type: "button", "aria-label": "Larger text", onclick: () => { sizeIdx++; applySize(); } }, "A");
  function applySize() {
    prose.style.setProperty("--read-size", SIZES[sizeIdx] + "rem");
    smaller.disabled = sizeIdx === 0;
    larger.disabled = sizeIdx === SIZES.length - 1;
  }
  applySize();

  const idx = sorted.indexOf(s);
  const next = sorted[idx + 1];

  const after = el("div", { class: "after" },
    el("div", { class: "after-actions" },
      el("button", { class: "btn", type: "button", onclick: () => shareStory(s) }, "Share story"),
      el("a", { class: "btn quiet", href: "#/", text: "All stories" })
    ),
    next ? el("a", { class: "next-link", href: "#/story/" + next.slug },
      el("span", { class: "next-label", text: "Next story" }),
      el("span", { class: "next-title", text: next.title }),
      el("span", { class: "next-blurb", text: next.blurb })
    ) : null
  );

  main.append(el("article", { class: "story" },
    el("a", { class: "back", href: "#/", text: "All stories" }),
    el("h1", { class: "story-title", text: s.title }),
    metaLine(s),
    el("div", { class: "sizes", role: "group", "aria-label": "Text size" }, smaller, larger),
    prose,
    el("p", { class: "end-mark", text: "The end" }),
    after
  ));
}

function renderMissing() {
  document.title = "Story not found – " + SITE.name;
  main.append(el("section", { class: "missing" },
    el("h1", { text: "That story isn’t here" }),
    el("p", { text: "The link may be wrong, or the story may have moved." }),
    el("a", { class: "btn", href: "#/", text: "See all stories" })
  ));
}

/* ---------- reading progress ---------- */
function onScroll() {
  if (!inStory) { progress.style.transform = "scaleX(0)"; return; }
  const max = document.documentElement.scrollHeight - window.innerHeight;
  const p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
  progress.style.transform = "scaleX(" + p + ")";
}
window.addEventListener("scroll", onScroll, { passive: true });
window.addEventListener("resize", onScroll);

/* ---------- routing (#/ and #/story/slug) ---------- */
function render(firstLoad) {
  const m = location.hash.match(/^#\/story\/([\w-]+)/);
  const story = m ? sorted.find(x => x.slug === m[1]) : null;
  main.replaceChildren();
  inStory = false;
  if (m && story) { renderStory(story); inStory = true; }
  else if (m) { renderMissing(); }
  else { renderHome(); }
  window.scrollTo(0, 0);
  if (!firstLoad) main.focus({ preventScroll: true });
  onScroll();
}
window.addEventListener("hashchange", () => render(false));
render(true);
</script>
</body>
</html>
